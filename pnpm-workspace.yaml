# pnpm-workspace.yaml: lists the projects of this repository, so one `pnpm install` at the root
# sets up all of them with one lock file.
#   apps/*      programs people use (today: the desktop app; later: the website)
#   packages/*  code the apps share (today: the course engine)
packages:
  - apps/*
  - packages/*

# Only these packages may run install scripts (esbuild downloads its compiled program).
allowBuilds:
  esbuild: true

<!doctype html>
<!--
  app.html
  The single HTML page that every screen is drawn into. SvelteKit fills in the %sveltekit.*% placeholders.
  (The doctype must stay on the first line, or the browser falls back to old "quirks" rendering.)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitRemastered</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

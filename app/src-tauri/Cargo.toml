# Cargo.toml: the Rust side of GitRemastered (the Tauri core) and the Rust libraries it uses.

[package]
name = "gitremastered"
version = "0.1.0"
description = "GitRemastered: learn Git and GitHub by using them"
authors = ["GitRemastered contributors"]
license = "MIT"
edition = "2024"

[lib]
# The "_lib" suffix keeps the library name different from the program name.
# Without it, Cargo mixes up the two output files on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "gitremastered_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
notify-debouncer-mini = "0.8.0"

[dev-dependencies]
# Temporary folders for tests with real Git; deleted when the test ends.
tempfile = "3"

# Smaller, faster release builds. Details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

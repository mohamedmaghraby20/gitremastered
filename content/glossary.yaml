# The course's glossary: one plain meaning per term, and the lessons that teach it.
# Shown in the command index (Terms), and later in the hover cards of links between lessons.
terms:
  - id: working-tree
    term: working tree
    meaning: "The files you see and edit in your project folder. Pro Git also calls it the working directory."
    lessons: [three-areas]
  - id: staging-area
    term: staging area
    meaning: "The changes you picked for the next commit, each one a photo of the file at the moment you ran `git add`. Also called the index."
    lessons: [three-areas]
  - id: repository
    term: repository
    meaning: "The `.git` folder: every commit you saved, plus what Git needs to track your project."
    lessons: [three-areas, start-a-repo]
  - id: commit
    term: commit
    meaning: "A saved snapshot of your project, with a message, an author and a date. Made from the staging area by `git commit`."
    lessons: [three-areas]
  - id: tracked-file
    term: tracked file
    meaning: "A file Git already follows, because it was in the last commit or is staged. Tracked files are unmodified, modified or staged."
    lessons: [three-areas, remove-move-files]
  - id: untracked-file
    term: untracked file
    meaning: "A file Git has never saved and does not follow yet. `git add` starts tracking it."
    lessons: [three-areas, ignoring-files]
  - id: head
    term: HEAD
    meaning: "Git's pointer to where you are: normally the branch you are on, and so its latest commit."
    lessons: [first-look-inside, branches-are-pointers, switch-and-detached-head]
  - id: branch
    term: branch
    meaning: "A named line of commits, like `main`. Each new commit moves the branch you are on forward."
    lessons: [branches-are-pointers]
  - id: gitignore
    term: .gitignore
    meaning: "A file of patterns that tells Git which untracked files to leave alone, like build output, logs and secrets."
    lessons: [ignoring-files]
  - id: glob-pattern
    term: glob pattern
    meaning: "A short rule that matches file names with wildcards: `*` for any characters, `?` for one, `[abc]` for one character from a list."
    lessons: [ignoring-files]
  - id: version-control
    term: version control
    meaning: "A system that records how files change over time, so you can go back to any earlier version and see who changed what. Git is a version control system."
    lessons: [what-is-git]
  - id: snapshot
    term: snapshot
    meaning: "A picture of all your project's files at one moment. Every commit holds one; Git stores snapshots, not lists of changes."
    lessons: [what-is-git]
  - id: checksum
    term: checksum
    meaning: "A code Git computes from content, like a fingerprint: the same content always gives the same code. Git's checksums are 40-character SHA-1 hashes, and they are the IDs of commits and files."
    lessons: [what-is-git, first-look-inside]
  - id: commit-id
    term: commit ID
    meaning: "The unique name of a commit: a 40-character checksum like `ca82a6d…`. The first 7 characters are usually enough to name it. Also called a hash or SHA."
    lessons: [what-is-git, first-look-inside, reading-history]
  - id: object
    term: object
    meaning: "One item in Git's storage, named by the checksum of its content. There are four kinds: blob, tree, commit and annotated tag."
    lessons: [first-look-inside]
  - id: blob
    term: blob
    meaning: "The object that holds one file's content, with no name attached. Two files with the same content share one blob."
    lessons: [first-look-inside]
  - id: tree
    term: tree
    meaning: "The object that holds one folder's listing: file names, each pointing at a blob or at another tree."
    lessons: [first-look-inside]
  - id: ref
    term: ref
    meaning: "A name that points at a commit, kept as a small file under `.git/refs`. Branches and tags are refs. Short for reference."
    lessons: [first-look-inside]
  - id: plumbing
    term: plumbing
    meaning: "Git's low-level commands, made for scripts and for looking inside, like `git cat-file`. The everyday commands (`git add`, `git commit`) are called porcelain."
    lessons: [first-look-inside]
  - id: config
    term: configuration
    meaning: "Git's settings, such as your name and your editor. They live at three levels: the whole computer (system), your user account (global) and one repository (local). The closest level wins."
    lessons: [setup]
  - id: clone
    term: clone
    meaning: "A full copy of a repository, with its whole history, made by `git clone`. It remembers where it came from as the remote `origin`."
    lessons: [start-a-repo]
  - id: diff
    term: diff
    meaning: "The line-by-line difference between two versions of your files: lines removed start with `-`, lines added start with `+`."
    lessons: [diffs-in-depth]
  - id: hunk
    term: hunk
    meaning: "One block of changed lines in a diff, with a few unchanged lines around it. It starts with a header like `@@ -1,3 +1,4 @@`."
    lessons: [diffs-in-depth]
  - id: amend
    term: amend
    meaning: "To replace your last commit with a corrected one, using `git commit --amend`. The old commit is not edited: a new one takes its place."
    lessons: [fix-last-commit]
  - id: revert
    term: revert
    meaning: "To undo an earlier commit by adding a new commit that makes the opposite change. History stays intact, so it is safe for shared branches."
    lessons: [revert-a-commit]
  - id: reset
    term: reset
    meaning: "To move the current branch to another commit with `git reset`. Depending on the option, the staging area and the working tree follow or stay as they are."
    lessons: [reset-demystified]
  - id: reflog
    term: reflog
    meaning: "Git's private diary of where HEAD and each branch pointed before. It keeps commits findable for a while after no branch reaches them."
    lessons: [fix-last-commit, reset-demystified]
  - id: detached-head
    term: detached HEAD
    meaning: "The state where HEAD points straight at a commit, not at a branch. You can look around and even commit, but no branch remembers those commits."
    lessons: [switch-and-detached-head]
  - id: merge
    term: merge
    meaning: "To bring the work of another branch into the branch you are on, with `git merge`."
    lessons: [branch-and-merge]
  - id: fast-forward
    term: fast-forward
    meaning: "The simplest merge: your branch has no commits of its own since the other branch started, so Git only moves its label forward. No merge commit is made."
    lessons: [branch-and-merge]
  - id: merge-commit
    term: merge commit
    meaning: "A commit with two parents, made when Git joins two branches that both have new commits."
    lessons: [branch-and-merge]
  - id: merge-conflict
    term: merge conflict
    meaning: "What happens when two branches changed the same lines differently. Git stops, marks the spot in the file, and waits for you to choose."
    lessons: [branch-and-merge]
  - id: merge-base
    term: merge base
    meaning: "The last commit two branches have in common. Git compares both branches against it to work out a merge."
    lessons: [branch-and-merge]
  - id: stash
    term: stash
    meaning: "A shelf for unfinished changes. `git stash` puts them away and gives you a clean working tree; `git stash pop` brings them back."
    lessons: [stash-and-clean]
  - id: remote
    term: remote
    meaning: "A short name for another copy of your repository, usually on a server, like `origin`. You fetch from it and push to it."
    lessons: [how-git-talks, remotes]
  - id: origin
    term: origin
    meaning: "The default name Git gives the remote you cloned from. It is only a name; you can have other remotes beside it."
    lessons: [start-a-repo, remotes]
  - id: bare-repository
    term: bare repository
    meaning: "A repository with no working tree, only Git's stored data. Servers keep repositories this way, in a folder ending in `.git`."
    lessons: [how-git-talks]
  - id: remote-tracking-branch
    term: remote-tracking branch
    meaning: "Your local bookmark for where a branch was on a remote the last time you talked to it, like `origin/main`. It moves only when you fetch, pull or push."
    lessons: [remotes, remote-branches]
  - id: upstream
    term: upstream branch
    meaning: "The remote-tracking branch your local branch follows, like `origin/main` for `main`. `git pull` and `git push` use it when you name nothing. A branch with one is called a tracking branch."
    lessons: [remote-branches]
  - id: fetch
    term: fetch
    meaning: "To download new commits from a remote and update your remote-tracking branches, without touching your own branches or files."
    lessons: [how-git-talks, remotes]
  - id: pull
    term: pull
    meaning: "A fetch followed by merging the fetched work into the branch you are on."
    lessons: [remotes]
  - id: push
    term: push
    meaning: "To upload your commits to a remote and move its branch to match yours."
    lessons: [how-git-talks, remotes]
  - id: refspec
    term: refspec
    meaning: "A rule that maps refs on one side to refs on the other when you fetch or push, written `source:destination`, like `refs/heads/*:refs/remotes/origin/*`."
    lessons: [refspecs]
  - id: tag
    term: tag
    meaning: "A fixed name for one commit, usually a release like `v1.0`. Unlike a branch, it never moves."
    lessons: [tags-and-releases]
  - id: annotated-tag
    term: annotated tag
    meaning: "A tag stored as its own object, with a message, the tagger's name and a date. Use it for releases. A tag without these is called lightweight."
    lessons: [tags-and-releases]
  - id: command-line
    term: command line
    meaning: "Using a program by typing commands in a terminal, instead of clicking in a graphical program (a GUI). On Windows, Git Bash is the terminal that comes with Git."
    lessons: [setup]
  - id: porcelain
    term: porcelain
    meaning: "Git's everyday, friendly commands, like `git add` and `git commit`. The low-level commands underneath are called plumbing."
    lessons: [first-look-inside]
  - id: parent-commit
    term: parent commit
    meaning: "The commit that came directly before another one. Every commit except the first stores its parent's ID; a merge commit has two parents."
    lessons: [first-look-inside, reading-history]
  - id: pager
    term: pager
    meaning: "The small viewer Git opens for long output, such as `git log`, one screen at a time. Space shows the next screen; `q` quits."
    lessons: [reading-history]
  - id: unstage
    term: unstage
    meaning: "To take a change back out of the staging area with `git restore --staged`. Your edits stay in the working tree."
    lessons: [undo-basics]
  - id: discard
    term: discard
    meaning: "To throw away edits in the working tree that were never committed, with `git restore`. Git cannot bring them back."
    lessons: [undo-basics]
  - id: squash
    term: squash
    meaning: "To turn several commits into one, for example with `git reset --soft` followed by one new commit."
    lessons: [reset-demystified]
  - id: conflict-marker
    term: conflict marker
    meaning: "One of the lines `<<<<<<<`, `=======` and `>>>>>>>` that Git writes into a file to show the two versions of a conflict."
    lessons: [branch-and-merge]
  - id: prune
    term: prune
    meaning: "To remove remote-tracking branches whose branch no longer exists on the server, with `git fetch --prune`."
    lessons: [remote-branches]
  - id: force-push
    term: force push
    meaning: "A push that overwrites a branch on the server even when that drops commits already there. Dangerous on shared branches."
    lessons: [refspecs]
  - id: lightweight-tag
    term: lightweight tag
    meaning: "A tag that is only a name on a commit, with no tagger, date or message. Good for a private bookmark."
    lessons: [tags-and-releases]
  - id: packfile
    term: packfile
    meaning: "One compressed file that holds many objects. Git sends objects this way on fetch and push."
    lessons: [how-git-talks]
  - id: workflow
    term: workflow
    meaning: "A team's agreement on how to use Git: which branches exist, what goes into each, and who may push or merge."
    lessons: [team-workflows]
  - id: topic-branch
    term: topic branch
    meaning: "A short-lived branch for one job, such as one feature or one bug fix. You merge it when the job is done and then delete it. Also called a feature branch."
    lessons: [team-workflows]
  - id: long-running-branch
    term: long-running branch
    meaning: "A branch that stays open for the life of the project, like `main` or `develop`. Each one stands for a level of stability, and work is merged into it from other branches."
    lessons: [team-workflows]
  - id: trunk-based-development
    term: trunk-based development
    meaning: "A way of working where everyone merges small changes into one main branch (the trunk) at least once a day, and topic branches live for hours, not weeks."
    lessons: [team-workflows]
  - id: git-flow
    term: Git Flow
    meaning: "A branching model with two long-running branches, `main` for released versions and `develop` for finished work, plus feature, release and hotfix branches."
    lessons: [team-workflows]
  - id: hotfix
    term: hotfix
    meaning: "An urgent fix to the version users already have. Its branch starts from `main` and is merged back right away, without waiting for the next release."
    lessons: [team-workflows]
  - id: rerere
    term: rerere
    meaning: "Short for \"reuse recorded resolution\". A setting that makes Git remember how you resolved a conflict and fill in the same answer when the very same conflict comes back."
    lessons: [advanced-merging]
  - id: merge-strategy
    term: merge strategy
    meaning: "The method Git uses to combine two branches. The default is called `ort`; `-s` picks another one, and `-X` passes a setting, like `-Xours`, to the one in use."
    lessons: [advanced-merging]
  - id: combined-diff
    term: combined diff
    meaning: "A diff with two columns of plus and minus signs, shown for a merge. It compares the merged file with both sides at once, so you see what each side lost and what was written new."
    lessons: [advanced-merging]
  - id: subtree-merge
    term: subtree merge
    meaning: "A merge that brings another project into a subfolder of yours, so its files land under that folder and its later updates can be merged again."
    lessons: [advanced-merging]
  - id: patch-mode
    term: patch mode
    meaning: "A way of running a command, started with `-p` or `--patch`, where Git shows your changes one hunk at a time and asks about each. `git add -p` stages the hunks you say yes to."
    lessons: [partial-staging]
  - id: interactive-staging
    term: interactive staging
    meaning: "Choosing what goes into the staging area by answering questions in the terminal: the `git add -i` menu, or patch mode with `git add -p`. A file with only some of its changes staged is called partially staged."
    lessons: [partial-staging]
  - id: backup-branch
    term: backup branch
    meaning: "An extra branch you create on the current commit before a risky fix, like `backup-main`. It keeps that commit and everything before it reachable, whatever you try next."
    lessons: [incident-playbook]
  - id: orig-head
    term: ORIG_HEAD
    meaning: "A name for where your branch was just before the last reset, merge or rebase moved it. `git reset --hard ORIG_HEAD` puts the branch back; the next such command overwrites it."
    lessons: [incident-playbook]
  - id: cherry-pick
    term: cherry-pick
    meaning: "To copy the change of one commit onto the branch you are on, as a new commit with a new ID (`git cherry-pick`). The original commit stays where it was."
    lessons: [integrating-work]
  - id: maintainer
    term: maintainer
    meaning: "The person who decides which work goes into a project's main branches: they review what contributors send and merge it, or turn it down."
    lessons: [integrating-work]
  - id: backport
    term: backport
    meaning: "To copy a fix from the newest line of work to an older release branch, usually with `git cherry-pick`, so people on the old version get the fix too."
    lessons: [integrating-work]
  - id: unreachable-commit
    term: unreachable commit
    meaning: "A commit that no branch or tag leads to any more, for example after a reset or a deleted branch. It still exists for a while and can be brought back by its ID."
    lessons: [rescue-lost-work]
  - id: dangling-commit
    term: dangling commit
    meaning: "An unreachable commit that nothing at all points at: no branch, no tag, no reflog line and no other commit. `git fsck` lists these, for example a dropped stash entry."
    lessons: [rescue-lost-work]
  - id: garbage-collection
    term: garbage collection
    meaning: "Git's tidy-up job, `git gc`. It packs objects together and deletes the ones that nothing leads to and that are old enough. Git runs it by itself from time to time."
    lessons: [rescue-lost-work]
  - id: rebase
    term: rebase
    meaning: "To replay the commits of a branch on top of another commit. The replayed commits are new commits with new IDs; the old ones are left behind. Done with `git rebase`."
    lessons: [rebasing]
  - id: linear-history
    term: linear history
    meaning: "A history that is one straight line of commits, with no merge commits. A rebase followed by a fast-forward keeps history linear."
    lessons: [rebasing]
  - id: patch-id
    term: patch ID
    meaning: "A checksum of only the change a commit makes, without its parent or dates. A commit and its rebased copy have different commit IDs but the same patch ID."
    lessons: [rebasing]
  - id: secret
    term: secret
    meaning: "Anything that gives access and must stay private: a password, an API key, an access token or a private key. A secret does not belong in a commit."
    lessons: [remove-sensitive-data]
  - id: secret-rotation
    term: rotating a secret
    meaning: "Replacing a leaked password or key with a new one at the service that issued it, so the old value stops working. Switching it off without a replacement is called revoking."
    lessons: [remove-sensitive-data]
  - id: rewriting-history
    term: rewriting history
    meaning: "Replacing existing commits with new ones, for example to remove a file from all of them. Every replaced commit gets a new ID, so it needs care once the commits are shared."
    lessons: [remove-sensitive-data]
  - id: interactive-rebase
    term: interactive rebase
    meaning: "A rebase that first shows you the list of commits it will replay and lets you edit it: reword, reorder, join, split or remove commits. Started with `git rebase -i`."
    lessons: [clean-up-history]
  - id: todo-list
    term: todo list
    meaning: "The file an interactive rebase opens in your editor: one line per commit, oldest on top, each starting with a command such as `pick` or `squash`. Also called the rebase script."
    lessons: [clean-up-history]
  - id: fixup-commit
    term: fixup commit
    meaning: "A small commit made with `git commit --fixup`, whose message starts with `fixup!` and names the older commit it corrects. A later rebase folds it into that commit."
    lessons: [clean-up-history]
  - id: autosquash
    term: autosquash
    meaning: "A rebase option (`--autosquash`) that moves every fixup commit under the commit it corrects and joins them, so you do not arrange the list by hand."
    lessons: [clean-up-history]
  - id: atomic-commit
    term: atomic commit
    meaning: "A commit that holds one complete job and nothing else: one bug fix, one feature. Pro Git calls it a logically separate changeset."
    lessons: [commit-craft]
  - id: subject-line
    term: subject line
    meaning: "The first line of a commit message, up to the first blank line. Short views such as `git log --oneline` show only this line. Also called the summary."
    lessons: [commit-craft]
  - id: trailing-whitespace
    term: trailing whitespace
    meaning: "Spaces or tabs left at the end of a line. They do nothing, but they show up as changes in a diff. `git diff --check` lists them."
    lessons: [commit-craft]
  - id: conventional-commits
    term: Conventional Commits
    meaning: "A team agreement to start each commit subject with a type, like `feat:` or `fix:`, so that people and tools can sort the history. It is a convention, not a Git feature."
    lessons: [commit-craft]
  - id: commit-template
    term: commit template
    meaning: "A text file Git puts into the editor as the starting commit message, usually with reminders of the team's message rules. Set with `commit.template`."
    lessons: [commit-craft]
  - id: trailer
    term: trailer
    meaning: "A `Key: value` line in the last paragraph of a commit message, such as `Co-authored-by:` or `BREAKING CHANGE:`. Tools read it as data."
    lessons: [commit-craft]
  - id: revision
    term: revision
    meaning: "Any name Git can turn into a commit: an ID, a short ID, a branch, a tag, `HEAD`, or one of those with a suffix like `~2`. Pro Git's word for \"a way to point at a commit\"."
    lessons: [revision-selection]
  - id: commit-range
    term: commit range
    meaning: "A group of commits named by two ends. `main..feature` means the commits `feature` has and `main` lacks; three dots mean the commits only one of the two has."
    lessons: [revision-selection]
  - id: reachable
    term: reachable
    meaning: "A commit is reachable from a branch when you get to it by starting at the branch's newest commit and following parents. The reachable commits are that branch's history."
    lessons: [revision-selection]
  - id: blame
    term: blame
    meaning: "A view of a file that shows, in front of every line, the last commit that changed it and its author. Made by `git blame`; also called file annotation."
    lessons: [search-blame-bisect]
  - id: bisect
    term: bisect
    meaning: "A search for the commit that broke something. You name a good and a bad commit, and `git bisect` has you test the commit halfway between them, again and again, until one is left. Also called a binary search."
    lessons: [search-blame-bisect]
  - id: pickaxe
    term: pickaxe
    meaning: "The nickname of `git log -S <text>`: it digs through history for the commits that added or removed a piece of text."
    lessons: [search-blame-bisect]
  - id: exit-code
    term: exit code
    meaning: "A number every command hands back when it ends: 0 means it worked, anything else means it failed. `git bisect run` reads it to tell a good commit from a bad one. Also called the exit status."
    lessons: [search-blame-bisect]
  - id: regular-expression
    term: regular expression
    meaning: "A pattern that describes text, where some characters have a special meaning: `.` stands for any character. A plain word is a pattern that matches itself. Also called a regex."
    lessons: [search-blame-bisect]
  - id: worktree
    term: worktree
    meaning: "A folder that holds the files of one branch, with its own HEAD and staging area, connected to a repository. One repository can have several, so several branches are checked out at once."
    lessons: [worktrees]
  - id: main-worktree
    term: main worktree
    meaning: "The folder you got from `git init` or `git clone`. It holds the `.git` directory, the repository that every other worktree uses."
    lessons: [worktrees]
  - id: linked-worktree
    term: linked worktree
    meaning: "An extra folder made by `git worktree add`, with another branch in it. It shares the commits and branches of the main worktree and keeps its own files."
    lessons: [worktrees]
  - id: hook
    term: hook
    meaning: "A script Git runs by itself at a set moment, such as just before a commit or when a push arrives. The file's name, like `pre-commit`, says which moment."
    lessons: [hooks]
  - id: client-side-hook
    term: client-side hook
    meaning: "A hook that runs on your own computer, during commands like `git commit` and `git push`. It catches mistakes early, but anyone can skip it with `--no-verify`."
    lessons: [hooks]
  - id: server-side-hook
    term: server-side hook
    meaning: "A hook that runs in the repository on the server when a push arrives, like `pre-receive` and `update`. The person pushing cannot skip it, so it can enforce a team's rules."
    lessons: [hooks]
  - id: shebang
    term: shebang
    meaning: "The first line of a script, starting with `#!`, that names the program that reads the rest of the file. `#!/bin/sh` means: run this file with the shell."
    lessons: [hooks]
  - id: hooks-path
    term: core.hooksPath
    meaning: "The setting that names the folder Git looks in for hooks, in place of `.git/hooks`. Teams point it at a tracked folder such as `.githooks` to share their hooks."
    lessons: [hooks]
  - id: executable-bit
    term: executable bit
    meaning: "The mark on a file, on macOS and Linux, that says it may be run as a program. `chmod +x` sets it on disk, and `git add --chmod=+x` records it in Git. Also called the execute permission."
    lessons: [hooks]
  - id: alias
    term: alias
    meaning: "A short name you make up for a Git command you use often, stored as the setting `alias.<name>`. After `git config alias.st status`, `git st` runs `git status`."
    lessons: [config-pro]
  - id: config-scope
    term: scope
    meaning: "Git's word for a level of settings: system (the whole computer), global (you) or local (one repository). When a setting exists in several scopes, the closest one wins. Also called a configuration level."
    lessons: [config-pro]
  - id: conditional-include
    term: conditional include
    meaning: "A rule in a config file, written `[includeIf \"...\"]`, that makes Git read a second settings file only in some repositories, for example all those under `~/work/`. Used to give work projects their own email."
    lessons: [config-pro]
  - id: line-ending
    term: line ending
    meaning: "The invisible characters that end each line of a text file: two on Windows (CRLF), one on macOS and Linux (LF). The setting `core.autocrlf` makes Git convert between them."
    lessons: [config-pro]
  - id: environment-variable
    term: environment variable
    meaning: "A named value that your terminal hands to every program it starts, like `HOME`. Git reads many of them, most starting with `GIT_`, to change how one command behaves."
    lessons: [plumbing-toolkit]
  - id: replacement-ref
    term: replacement ref
    meaning: "A ref under `refs/replace`, made by `git replace`, that tells Git to show a different object whenever one particular object is asked for. The original object stays stored; a replacement that gives a commit new parents is also called a graft."
    lessons: [plumbing-toolkit]
  - id: object-database
    term: object database
    meaning: "The folder `.git/objects`, where Git keeps every object: each version of each file, each folder listing and each commit. Also called the object store."
    lessons: [objects-deep]
  - id: content-addressable-storage
    term: content-addressable storage
    meaning: "A store where the key of an item is computed from the item's content, so the same content always has the same key. Git's object database works this way: hand in content, get back its ID."
    lessons: [objects-deep]
  - id: file-mode
    term: file mode
    meaning: "The number in front of each line of a tree that says what kind of entry it is: `100644` a normal file, `100755` a file that may be run as a program, `120000` a symbolic link, `040000` a folder."
    lessons: [objects-deep]
  - id: object-header
    term: object header
    meaning: "The few bytes Git puts in front of an object's content before computing its ID: the type, the size in bytes and a zero byte, like `blob 8`."
    lessons: [objects-deep]
  - id: sha-1
    term: SHA-1
    meaning: "The checksum method Git uses by default. It turns any content into 40 characters, and those 40 characters are the object's ID. Also written SHA1."
    lessons: [objects-deep]
  - id: sha-256
    term: SHA-256
    meaning: "A newer, stronger checksum method that Git can use in place of SHA-1. Its IDs have 64 characters. You pick it when you create a repository, with `git init --object-format=sha256`."
    lessons: [objects-deep]
  - id: zlib
    term: zlib
    meaning: "The compression method Git uses to make each object smaller before writing it to disk. ZIP and PNG files use the same method."
    lessons: [objects-deep]
  - id: symbolic-ref
    term: symbolic ref
    meaning: "A ref that holds the name of another ref, not an ID. HEAD is the usual one: it holds `ref: refs/heads/main` when you are on `main`. Also called a symbolic reference."
    lessons: [refs-deep]
  - id: tag-object
    term: tag object
    meaning: "The object Git creates for an annotated tag. It holds the tag's name, message, author and date, and the ID of the commit it marks. The tag's ref holds the tag object's ID, not the commit's."
    lessons: [refs-deep]
  - id: packed-refs
    term: packed refs
    meaning: "Refs stored as lines in the single file `.git/packed-refs`, in place of one small file each under `.git/refs`. `git gc` packs them; Git reads both kinds, so always ask Git and not the folder."
    lessons: [refs-deep]
  - id: reftable
    term: reftable
    meaning: "A newer way for Git to store refs and their logs: a few compact binary files under `.git/reftable`, with no file per ref. You pick it with `git init --ref-format=reftable`."
    lessons: [refs-deep]
  - id: signature
    term: signature
    meaning: "A block of text stored in a commit or tag, made with the signer's private key. It proves who made the commit and that nothing in it was changed since. A commit that has one is called a signed commit."
    lessons: [signing]
  - id: key-pair
    term: key pair
    meaning: "Two matching keys made together: a private key that you keep secret and sign with, and a public key that you hand out so others can check your signatures."
    lessons: [signing]
  - id: signing-key
    term: signing key
    meaning: "The key Git signs your commits and tags with, named by the setting `user.signingkey`. It is a GPG key ID or the path of an SSH public key file."
    lessons: [signing]
  - id: gpg
    term: GPG
    meaning: "GNU Privacy Guard, a free program for encrypting and signing. It is the signing tool Pro Git uses; Git can also sign with an SSH key."
    lessons: [signing]
  - id: allowed-signers-file
    term: allowed signers file
    meaning: "A text file that lists whose SSH key is whose: an email and a public key on each line. Git needs it, through `gpg.ssh.allowedSignersFile`, to check SSH signatures."
    lessons: [signing]
  - id: verified-badge
    term: Verified badge
    meaning: "The label GitHub shows next to a commit or tag whose signature it could check against a key on the committer's account."
    lessons: [signing]
  - id: vigilant-mode
    term: vigilant mode
    meaning: "A GitHub account setting that marks every commit carrying your name without your signature as \"Unverified\", so fakes stand out."
    lessons: [signing]
  - id: gitattributes
    term: .gitattributes
    meaning: "A file of patterns and attributes that tells Git how to treat the files it tracks: which are binary, which line endings they get, how they are merged or exported. An attribute is a label Git puts on every file a pattern matches."
    lessons: [attributes]
  - id: binary-file
    term: binary file
    meaning: "A file that is not made of readable lines of text, like an image or a compiled program. Git stores it, but cannot show a line-by-line diff of it or merge two people's changes to it."
    lessons: [attributes]
  - id: merge-driver
    term: merge driver
    meaning: "A program Git runs to combine two versions of one file during a merge, in place of its normal line-by-line merge. A `merge=<name>` attribute picks it per file, and a `merge.<name>.driver` setting defines it."
    lessons: [attributes]
  - id: clean-smudge-filter
    term: clean and smudge filters
    meaning: "A pair of programs Git runs on a file's content: clean when the file is staged, smudge when it is checked out. A `filter=<name>` attribute picks them per file. Git LFS works this way."
    lessons: [attributes]
  - id: gui
    term: GUI
    meaning: "A graphical user interface: a program you use by clicking, like the Git panel in VS Code or GitHub Desktop. Its buttons run the same Git commands you type on the command line."
    lessons: [git-in-your-tools]
  - id: shell-prompt
    term: prompt
    meaning: "The text your terminal prints before each command you type, like `$`. A Git-aware prompt also shows the current branch, and marks for uncommitted changes."
    lessons: [git-in-your-tools]
  - id: tab-completion
    term: tab completion
    meaning: "You type the start of a command, option or branch name and press the Tab key, and the shell finishes the word. Git ships completion scripts for Bash and Zsh."
    lessons: [git-in-your-tools]
  - id: diff-tool
    term: diff tool
    meaning: "A program that shows two versions of a file side by side. `git difftool` opens the one named in `diff.tool`; a merge tool (`git mergetool`, `merge.tool`) does the same for a conflict."
    lessons: [git-in-your-tools]
  - id: submodule
    term: submodule
    meaning: "A Git repository kept in a subfolder of another Git repository. The outer project records the inner one's address and one exact commit, not its files."
    lessons: [submodules]
  - id: superproject
    term: superproject
    meaning: "The outer repository that contains a submodule. Also called the main project."
    lessons: [submodules]
  - id: gitlink
    term: gitlink
    meaning: "The entry a project keeps for a submodule: a folder name with the ID of one commit of the other repository, stored with mode `160000`. This is the pointer that pins the submodule."
    lessons: [submodules]
  - id: shallow-clone
    term: shallow clone
    meaning: "A clone whose history is cut short, made with `git clone --depth 1`. It holds the newest commit (or the newest few) with all of its files, and leaves older commits on the server."
    lessons: [large-repos]
  - id: partial-clone
    term: partial clone
    meaning: "A clone that holds every commit but downloads a file's contents only when a command needs them, made with `git clone --filter=blob:none`. Also called a blobless clone."
    lessons: [large-repos]
  - id: sparse-checkout
    term: sparse checkout
    meaning: "A working tree that holds only the folders you chose with `git sparse-checkout set`. The other files stay tracked and stay in every commit; they are just not written to your disk."
    lessons: [large-repos]
  - id: git-lfs
    term: Git LFS
    meaning: "Git Large File Storage: a separate program that keeps big files, like pictures and videos, outside the repository. Git commits a small text file, a pointer, in place of each one."
    lessons: [large-repos]
  - id: bundle
    term: bundle
    meaning: "One ordinary file that holds commits, made with `git bundle create`. You can carry it on a USB stick or email it, and clone or fetch from it when there is no network."
    lessons: [large-repos]
  - id: loose-object
    term: loose object
    meaning: "An object stored as its own file under `.git/objects`. Every new object starts this way; later Git moves it into a packfile."
    lessons: [packfiles-gc]
  - id: delta
    term: delta
    meaning: "An object stored inside a packfile as the difference from a similar object, called its base. Git rebuilds the full object whenever you read it."
    lessons: [packfiles-gc]
  - id: pack-index
    term: pack index
    meaning: "The `.idx` file beside a packfile: a table that says where in the packfile each object starts, so Git can jump straight to it."
    lessons: [packfiles-gc]
  - id: cruft-pack
    term: cruft pack
    meaning: "A separate packfile where `git gc` keeps objects that nothing leads to any more, until they are old enough to delete."
    lessons: [packfiles-gc]
  - id: non-fast-forward
    term: non-fast-forward
    meaning: "A move of a branch that leaves out commits the branch had before, for example after an amend or a rebase. A normal push refuses it; only a force push makes the server do it."
    lessons: [force-push-safely]
  - id: force-with-lease
    term: lease (force-with-lease)
    meaning: "A condition on a force push: `git push --force-with-lease` overwrites the server's branch only if it is still where you last saw it. If someone pushed in the meantime, Git refuses."
    lessons: [force-push-safely]
  - id: ssh
    term: SSH
    meaning: "Secure Shell: a secure way to connect to a server and sign in with a key pair in place of a password. Git can fetch and push over it, with addresses like `git@github.com:user/repo.git`."
    lessons: [github-account-ssh]
  - id: public-key
    term: public key
    meaning: "The half of a key pair you hand out, kept in a file ending in `.pub`. A server such as GitHub uses it to check that you hold the matching private key."
    lessons: [github-account-ssh]
  - id: private-key
    term: private key
    meaning: "The secret half of a key pair. It stays on your computer and is never sent, pasted or committed; whoever holds it can sign in as you."
    lessons: [github-account-ssh]
  - id: passphrase
    term: passphrase
    meaning: "A password that locks a private key file, so a copied file is useless without it."
    lessons: [github-account-ssh]
  - id: ssh-agent
    term: SSH agent
    meaning: "A small background program that holds your unlocked SSH keys in memory, so you type each passphrase once. `ssh-add` gives it a key."
    lessons: [github-account-ssh]
  - id: key-fingerprint
    term: key fingerprint
    meaning: "A short checksum of a key, like `SHA256:DBB/zlu...`. Two keys are the same exactly when their fingerprints match. `ssh-keygen -lf <file>` prints it."
    lessons: [github-account-ssh]
  - id: credential-helper
    term: credential helper
    meaning: "A small program Git asks for your user name and password or token, so you do not type them at every push. The setting `credential.helper` names it."
    lessons: [github-account-ssh]
  - id: personal-access-token
    term: personal access token
    meaning: "A long password GitHub generates for you, limited in what it may do and when it expires. Git sends it over HTTPS in place of your account password. Also called a PAT, or just a token."
    lessons: [github-account-ssh]
  - id: two-factor-authentication
    term: two-factor authentication
    meaning: "Signing in with two different proofs: your password, and a second thing only you have, usually a code from an app on your phone. Also called 2FA."
    lessons: [github-account-ssh]
  - id: github-cli
    term: GitHub CLI
    meaning: "GitHub's own command-line program, `gh`. It signs you in to GitHub and works with pull requests, issues and other things on GitHub from the terminal."
    lessons: [github-account-ssh]
  - id: organization
    term: organization
    meaning: "A shared account on GitHub that belongs to a group, such as a company or an open source project. Nobody signs in as the organization: people join it with their personal accounts."
    lessons: [orgs-teams-permissions]
  - id: organization-owner
    term: organization owner
    meaning: "A person with full control of an organization on GitHub: they manage its people, teams and settings, and have admin access to every repository in it."
    lessons: [orgs-teams-permissions]
  - id: team
    term: team
    meaning: "A named group of members inside an organization on GitHub. A role given to the team on a repository goes to everyone on it, and the whole team can be mentioned at once."
    lessons: [orgs-teams-permissions]
  - id: team-mention
    term: team mention
    meaning: "Writing `@organization/team-name` in an issue, a pull request or a CODEOWNERS file. In a conversation it notifies every member of that team."
    lessons: [orgs-teams-permissions]
  - id: repository-role
    term: repository role
    meaning: "A named set of permissions for one repository on GitHub: Read, Triage, Write, Maintain or Admin. Each role includes everything the lower ones can do. Also called an access level."
    lessons: [orgs-teams-permissions]
  - id: base-permissions
    term: base permissions
    meaning: "The level of access every member of an organization has on all of its repositories, set by an owner. A higher role from a team or given directly wins over it."
    lessons: [orgs-teams-permissions]
  - id: outside-collaborator
    term: outside collaborator
    meaning: "A person who has access to one or more repositories of an organization without being a member of it, such as a consultant. They cannot be on a team."
    lessons: [orgs-teams-permissions]
  - id: audit-log
    term: audit log
    meaning: "An organization's record of who did what and when, such as adding a person or deleting a repository. Only owners can read it."
    lessons: [orgs-teams-permissions]
  - id: single-sign-on
    term: single sign-on
    meaning: "Signing in through your company's own sign-in page before GitHub shows you the organization's work. Often shortened to SSO."
    lessons: [orgs-teams-permissions]
  - id: issue
    term: issue
    meaning: "One numbered entry in a repository's to-do list on GitHub: a bug, an idea, a question or a task, with a conversation below it. Issues live on GitHub, not in Git."
    lessons: [issues-projects-security]
  - id: label
    term: label
    meaning: "A coloured word on an issue or pull request that says what kind it is, like `bug` or `documentation`. Used to sort and filter the list."
    lessons: [issues-projects-security]
  - id: milestone
    term: milestone
    meaning: "A named goal on GitHub, such as a release, that groups issues and pull requests. Its page shows a due date and how much is done."
    lessons: [issues-projects-security]
  - id: closing-keyword
    term: closing keyword
    meaning: "A word like `Fixes`, `Closes` or `Resolves` written before an issue number in a commit message or a pull request description. GitHub closes that issue when the change reaches the default branch."
    lessons: [issues-projects-security]
  - id: issue-template
    term: issue template
    meaning: "A file in `.github/ISSUE_TEMPLATE` that fills in the text of a new issue in advance, so reporters answer the questions the team needs. An issue form is a template with real form fields."
    lessons: [issues-projects-security]
  - id: github-project
    term: project (GitHub Projects)
    meaning: "A planning page on GitHub that collects issues and pull requests and shows them as a table, a board of columns or a roadmap. It belongs to a person or an organization, not to one repository."
    lessons: [issues-projects-security]
  - id: dependency
    term: dependency
    meaning: "A package someone else wrote that your project needs in order to run, listed in a file such as `package.json` or `requirements.txt`."
    lessons: [issues-projects-security]
  - id: vulnerability
    term: vulnerability
    meaning: "A mistake in code that lets an attacker do something they should not, such as read private data. Also called a security hole."
    lessons: [issues-projects-security]
  - id: dependabot
    term: Dependabot
    meaning: "GitHub's robot for dependencies. It warns about versions with a known vulnerability (alerts) and opens pull requests that move packages to newer versions (updates)."
    lessons: [issues-projects-security]
  - id: secret-scanning
    term: secret scanning
    meaning: "GitHub reading a repository's whole history for strings shaped like known secrets, such as access tokens, and raising an alert for each one it finds."
    lessons: [issues-projects-security]
  - id: push-protection
    term: push protection
    meaning: "A GitHub check that runs while a push arrives and refuses the push if a commit holds a secret it knows. The secret never reaches the repository."
    lessons: [issues-projects-security]
  - id: security-policy
    term: security policy
    meaning: "A file named `SECURITY.md` that tells people how to report a vulnerability in private, and which versions still get fixes."
    lessons: [issues-projects-security]
  - id: security-advisory
    term: security advisory
    meaning: "A page on a GitHub repository where maintainers discuss and fix a vulnerability in private, then publish the details once a fixed version is out."
    lessons: [issues-projects-security]
  - id: branch-protection
    term: branch protection
    meaning: "Rules a hosting service such as GitHub enforces on a branch, like no force pushes, no deletion, or changes only through a pull request. On GitHub the older form is a branch protection rule; the newer one is a ruleset."
    lessons: [branch-protection-codeowners]
  - id: ruleset
    term: ruleset
    meaning: "A named list of rules on GitHub, together with the branches or tags they apply to and the people who may bypass them. Several rulesets can apply to one branch, and their rules add up."
    lessons: [branch-protection-codeowners]
  - id: bypass-list
    term: bypass list
    meaning: "The roles, teams or apps a ruleset allows to break its rules. Everyone else, admins included, is bound by them."
    lessons: [branch-protection-codeowners]
  - id: code-owner
    term: code owner
    meaning: "A person or team that the CODEOWNERS file of a repository names as responsible for some files. GitHub asks them to review every pull request that changes those files."
    lessons: [branch-protection-codeowners]
  - id: status-check
    term: status check
    meaning: "A pass or fail verdict that an automated tool, such as a test run, attaches to a commit. A branch rule can require it to pass before a pull request is merged."
    lessons: [branch-protection-codeowners]
  - id: collaborator
    term: collaborator
    meaning: "A person the owner invited to a repository on GitHub. A collaborator can push commits to it directly; everyone else contributes through pull requests."
    lessons: [maintaining-github-repo]
  - id: pull-request-ref
    term: pull request ref
    meaning: "A name GitHub keeps on the server for every pull request, like `refs/pull/4/head`, that points at its newest commit. Fetching it brings the pull request to your computer, even when its branch lives in a fork."
    lessons: [maintaining-github-repo]
  - id: community-health-file
    term: community health file
    meaning: "A file GitHub finds by name and shows in the right place, such as `CONTRIBUTING.md`, `CODE_OF_CONDUCT.md` or `SECURITY.md`. It may sit in the top folder, in `docs` or in `.github`."
    lessons: [maintaining-github-repo]
  - id: pull-request-template
    term: pull request template
    meaning: "A file, usually `.github/pull_request_template.md`, whose text GitHub puts into the description of every new pull request, so contributors answer the same questions each time."
    lessons: [maintaining-github-repo]
  - id: default-branch
    term: default branch
    meaning: "The branch GitHub shows first, that a new clone starts on, and that new pull requests target. Usually `main`; the owner can change it in the repository settings."
    lessons: [maintaining-github-repo]
  - id: upstream-remote
    term: upstream (remote)
    meaning: "The usual name for the remote that points at the original project you forked, next to `origin` for your own fork. You fetch from `upstream` and push to `origin`. Not the same thing as the upstream branch of a branch."
    lessons: [team-contributing]
  - id: contributor
    term: contributor
    meaning: "Someone who sends work to a project: commits on a branch that a maintainer or integrator then merges, or turns down."
    lessons: [team-contributing]
  - id: integrator
    term: integrator
    meaning: "On a managed team, one of the few engineers allowed to update `main`. They merge the feature branches the other developers push. Also called an integration manager."
    lessons: [team-contributing]
  - id: pull-request
    term: pull request
    meaning: "A page on GitHub that asks to merge one branch (the head) into another (the base), with room to discuss and review the change first. Often shortened to PR; other sites call it a merge request."
    lessons: [github-flow-prs]
  - id: github-flow
    term: GitHub Flow
    meaning: "A simple team routine built on pull requests: branch from `main`, commit, push, open a pull request, review, merge, delete the branch."
    lessons: [github-flow-prs]
  - id: fork
    term: fork
    meaning: "Your own copy, on GitHub and under your account, of a repository that belongs to someone else. You can push to it, and open pull requests from it to the original."
    lessons: [github-flow-prs]
  - id: draft-pull-request
    term: draft pull request
    meaning: "A pull request marked as work in progress. People can read and comment on it, but GitHub does not let anyone merge it until it is marked ready for review."
    lessons: [github-flow-prs]
  - id: code-review
    term: review
    meaning: "A second person reading a change before it is merged, to catch mistakes and share knowledge. On GitHub a review of a pull request ends with one of three outcomes: comment, approve or request changes. Also called code review."
    lessons: [code-review]
  - id: line-comment
    term: line comment
    meaning: "A comment on a pull request that is attached to one line, or a few lines, of the diff, so the author sees exactly which code it is about. Also called a review comment."
    lessons: [code-review]
  - id: suggested-change
    term: suggested change
    meaning: "A line comment on GitHub that holds the reviewer's own version of the line. The author can put it into the pull request as a commit with one click."
    lessons: [code-review]
  - id: approval
    term: approval
    meaning: "A review that says the pull request can be merged. A repository can require one or more approvals before merging, and nobody can approve their own pull request."
    lessons: [code-review]
  - id: release
    term: release
    meaning: "On GitHub, a page built on a tag: the tag marks the commit, and the page adds a title, release notes and files to download. Also called a GitHub release."
    lessons: [tags-and-releases]
  - id: base-branch
    term: base branch
    meaning: "In a pull request, the branch that receives the work, usually `main`."
    lessons: [pr-merge-strategies]
  - id: head-branch
    term: head branch
    meaning: "In a pull request, the branch the work comes from: your topic branch. GitHub can delete it automatically once the pull request is merged."
    lessons: [pr-merge-strategies]
  - id: merge-method
    term: merge method
    meaning: "The way GitHub brings a pull request into its base branch: a merge commit, a squash, or a rebase. The repository's settings decide which ones are offered. Also called a merge strategy for pull requests."
    lessons: [pr-merge-strategies]
  - id: squash-merge
    term: squash merge
    meaning: "Merging a pull request as one new commit that holds all of its changes. The pull request's own commits do not become part of the base branch. On GitHub the button is Squash and merge."
    lessons: [pr-merge-strategies]
  - id: rebase-merge
    term: rebase merge
    meaning: "Merging a pull request by copying each of its commits onto the base branch, with new commit IDs and no merge commit. On GitHub the button is Rebase and merge."
    lessons: [pr-merge-strategies]
  - id: continuous-integration
    term: continuous integration
    meaning: "Having a server build the project and run its tests by itself on every push, and report the result. Also called CI."
    lessons: [github-actions-ci]
  - id: github-actions
    term: GitHub Actions
    meaning: "GitHub's built-in tool that runs commands on GitHub's computers when something happens in a repository, such as a push or a pull request. Mostly used for continuous integration."
    lessons: [github-actions-ci]
  - id: actions-workflow
    term: workflow file
    meaning: "A YAML file in `.github/workflows` that tells GitHub Actions which event starts it and which commands to run. Also called a workflow, not to be confused with a team's workflow."
    lessons: [github-actions-ci]
  - id: runner
    term: runner
    meaning: "The computer that does one job of a GitHub Actions workflow. GitHub starts a fresh one for each job and deletes it afterwards."
    lessons: [github-actions-ci]
  - id: workflow-run
    term: workflow run
    meaning: "One execution of a GitHub Actions workflow for one commit, with a result of success or failure. Also called a run."
    lessons: [github-actions-ci]
  - id: api
    term: API
    meaning: "A way for a program, not a person, to use a service: a fixed list of requests it may send and the data it gets back. Short for application programming interface. GitHub's API can do nearly everything its website can."
    lessons: [gh-cli-and-api]
  - id: endpoint
    term: endpoint
    meaning: "One address of an API, for one kind of thing, like `repos/OWNER/REPO/issues` for a repository's issues."
    lessons: [gh-cli-and-api]
  - id: json
    term: JSON
    meaning: "A plain-text format for data that almost every program can read. Curly braces hold names with values, square brackets hold lists. GitHub's API answers in JSON."
    lessons: [gh-cli-and-api]
  - id: rest-api
    term: REST API
    meaning: "GitHub's main API: each thing has its own address, and the kind of request says what to do with it (GET reads, POST creates, PATCH changes, DELETE removes)."
    lessons: [gh-cli-and-api]
  - id: graphql
    term: GraphQL
    meaning: "GitHub's second API. You send one query that names exactly the fields you want, and the answer holds those fields and nothing more."
    lessons: [gh-cli-and-api]
  - id: webhook
    term: webhook
    meaning: "A message GitHub sends to a web address of yours at the moment something happens in a repository, such as a push. Your own program receives it and reacts. Also called a hook on GitHub, not to be confused with Git's hooks."
    lessons: [gh-cli-and-api]
  - id: rate-limit
    term: rate limit
    meaning: "The number of requests GitHub's API accepts from you per hour: 60 without signing in, 5,000 signed in. Past it, requests fail until the hour is over."
    lessons: [gh-cli-and-api]
  - id: pagination
    term: pagination
    meaning: "An API sending a long list in pages, 30 items at a time on GitHub. A script must ask for every page, or it sees only the first."
    lessons: [gh-cli-and-api]

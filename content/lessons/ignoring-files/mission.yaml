brief: "The build just made a build folder and a log file, and git status is full of noise. Ignore them with a .gitignore and commit it, so the working folder is clean."
setup:
  - git init -q -b main
  - git config core.autocrlf false
  - git config user.name > /dev/null || git config user.name "Practice Student"
  - git config user.email > /dev/null || git config user.email "student@example.com"
  - echo "# Shop app" > README.md
  - git add README.md
  - git commit -q -m "Add README"
  - mkdir build
  - echo "compiled program" > build/app.bin
  - 'echo "debug: started" > app.log'
goal:
  - check: file-is-committed
    file: .gitignore
    label: ".gitignore is committed"
  - check: working-folder-clean
    label: "git status shows nothing left to do"
  - check: commit-count-at-least
    count: 2
    label: "The history has your new commit"
hints:
  - "Run git status. Which two things should never be committed?"
  - "Create a file named .gitignore with one line for the build folder and one for log files."
  - "Run: printf 'build/\\n*.log\\n' > .gitignore, then git add .gitignore and git commit -m \"Ignore build output and logs\""
solution:
  - printf 'build/\n*.log\n' > .gitignore
  - git add .gitignore
  - git commit -q -m "Ignore build output and logs"

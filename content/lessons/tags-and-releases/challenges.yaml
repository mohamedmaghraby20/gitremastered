challenges:
  - id: tag-the-release
    title: Mark version 1.0
    level: easy
    brief: "The notes app is ready: its newest commit sets the version to 1.0. Mark that commit as release v1.0, with a tag that records who released it and a message."
    setup:
      - git init -q -b main
      - git config core.autocrlf false
      - git config user.name > /dev/null || git config user.name "Practice Student"
      - git config user.email > /dev/null || git config user.email "student@example.com"
      - echo "# Notes app" > README.md
      - git add README.md
      - git commit -q -m "Add README"
      - echo "function search() {}" > search.js
      - git add search.js
      - git commit -q -m "Add search page"
      - echo "function search(text) { if (!text) return []; }" > search.js
      - git commit -q -am "Fix search for empty text"
      - echo "function exportPdf() {}" > export.js
      - git add export.js
      - git commit -q -m "Add export to PDF"
      - echo "1.0" > VERSION
      - git add VERSION
      - git commit -q -m "Set version to 1.0"
      - git init -q --bare -b main ../origin.git
      - git remote add origin ../origin.git
      - git push -q -u origin main
    goal:
      - check: tag-exists
        tag: v1.0
        label: "A tag named v1.0 exists"
      - check: tag-is-annotated
        tag: v1.0
        label: "v1.0 is an annotated tag (it has a tagger and a message)"
      - check: tag-is-on-commit
        tag: v1.0
        message: "Set version to 1.0"
        label: "v1.0 sits on the commit \"Set version to 1.0\""
    hints:
      - "Which kind of tag records who made it and when? Look at the table \"Two kinds of tag\"."
      - "git tag with -a makes an annotated tag on the commit you are on. Give it a message with -m."
      - "Run: git tag -a v1.0 -m \"Version 1.0\""
    solution:
      - git tag -a v1.0 -m "Version 1.0"

  - id: tag-later-and-share
    title: A release nobody tagged
    level: medium
    brief: "Version 0.9 went out two commits ago, at the commit \"Set version to 0.9\", and nobody tagged it. Version 1.0 is tagged, but only on your computer. Tag 0.9 as v0.9 (annotated), then get both tags onto the server."
    setup:
      - git init -q -b main
      - git config core.autocrlf false
      - git config user.name > /dev/null || git config user.name "Practice Student"
      - git config user.email > /dev/null || git config user.email "student@example.com"
      - echo "# Notes app" > README.md
      - git add README.md
      - git commit -q -m "Add README"
      - echo "function search() {}" > search.js
      - git add search.js
      - git commit -q -m "Add search page"
      - echo "0.9" > VERSION
      - git add VERSION
      - git commit -q -m "Set version to 0.9"
      - echo "function exportPdf() {}" > export.js
      - git add export.js
      - git commit -q -m "Add export to PDF"
      - echo "1.0" > VERSION
      - git commit -q -am "Set version to 1.0"
      - git init -q --bare -b main ../origin.git
      - git remote add origin ../origin.git
      - git push -q -u origin main
      - git tag -a v1.0 -m "Version 1.0"
    goal:
      - check: tag-is-on-commit
        tag: v0.9
        message: "Set version to 0.9"
        label: "v0.9 sits on the commit \"Set version to 0.9\""
      - check: tag-is-annotated
        tag: v0.9
        label: "v0.9 is an annotated tag"
      - check: remote-has-tag
        tag: v0.9
        label: "The server has the tag v0.9"
      - check: remote-has-tag
        tag: v1.0
        label: "The server has the tag v1.0"
    hints:
      - "Run git log --oneline to find the ID of \"Set version to 0.9\". Then ask the server which tags it has: git ls-remote --tags origin."
      - "A commit ID at the end of git tag -a puts the tag on that commit. Plain git push does not send tags."
      - "Run: git tag -a v0.9 <id> -m \"Version 0.9\" with the ID from git log, then git push origin v0.9 v1.0 (or git push origin --tags)."
    solution:
      - git tag -a v0.9 -m "Version 0.9" "$(git log --format=%h --grep='Set version to 0.9')"
      - git push -q origin v0.9 v1.0

  - id: move-a-pushed-tag
    title: The tag is on the wrong commit
    level: hard
    brief: "You tagged v2.0 a minute too late: it sits on \"Start work on version 2.1\" instead of \"Set version to 2.0\", and it is already on the server. Nobody has fetched it yet. Put v2.0 on the right commit, here and on the server, and push your waiting commit so main is level with origin/main."
    setup:
      - git init -q -b main
      - git config core.autocrlf false
      - git config user.name > /dev/null || git config user.name "Practice Student"
      - git config user.email > /dev/null || git config user.email "student@example.com"
      - echo "# Notes app" > README.md
      - git add README.md
      - git commit -q -m "Add README"
      - echo "function search() {}" > search.js
      - git add search.js
      - git commit -q -m "Add search page"
      - echo "function exportPdf() {}" > export.js
      - git add export.js
      - git commit -q -m "Add export to PDF"
      - echo "2.0" > VERSION
      - git add VERSION
      - git commit -q -m "Set version to 2.0"
      - git init -q --bare -b main ../origin.git
      - git remote add origin ../origin.git
      - git push -q -u origin main
      - echo "Ideas for 2.1" > PLAN.md
      - git add PLAN.md
      - git commit -q -m "Start work on version 2.1"
      - git tag -a v2.0 -m "Version 2.0"
      - git push -q origin v2.0
    goal:
      - check: tag-is-on-commit
        tag: v2.0
        message: "Set version to 2.0"
        label: "v2.0 sits on the commit \"Set version to 2.0\""
      - check: tag-is-annotated
        tag: v2.0
        label: "v2.0 is an annotated tag"
      - check: remote-has-tag
        tag: v2.0
        label: "The server has a tag v2.0"
      - check: branch-is-in-sync
        branch: main
        label: "main is level with origin/main"
    hints:
      - "A tag cannot be moved, only deleted and made again. It exists in two places. Run git show v2.0 and git ls-remote --tags origin to see both."
      - "Delete it here (git tag -d) and on the server (git push origin --delete), then tag the right commit by its ID. If you push the new tag while the old one is still on the server, Git rejects it: \"already exists\"."
      - "Run: git tag -d v2.0, git push origin --delete v2.0, git tag -a v2.0 <id> -m \"Version 2.0\" with the ID of \"Set version to 2.0\", then git push origin v2.0 and git push."
    solution:
      - git tag -d v2.0
      - git push -q origin --delete v2.0
      - git tag -a v2.0 -m "Version 2.0" "$(git log --format=%h --grep='Set version to 2.0')"
      - git push -q origin v2.0
      - git push -q

  - id: publish-a-release
    title: Publish version 1.0 on GitHub
    level: hard
    brief: "This challenge runs on a practice repository in your own GitHub account. The notes app is ready: its newest commit sets the version to 1.0, and the commits are on GitHub. Tag that commit as v1.0 with an annotated tag, get the tag onto GitHub, and publish a GitHub release for it with a title and a line of notes."
    github:
      repo: gitremastered-practice-tags-and-releases
    setup:
      - git init -q -b main
      - git config core.autocrlf false
      - git config user.name > /dev/null || git config user.name "Practice Student"
      - git config user.email > /dev/null || git config user.email "student@example.com"
      - echo "# Notes app" > README.md
      - git add README.md
      - git commit -q -m "Add README"
      - echo "function search() {}" > search.js
      - git add search.js
      - git commit -q -m "Add search page"
      - echo "function search(text) { if (!text) return []; }" > search.js
      - git commit -q -am "Fix search for empty text"
      - echo "function exportPdf() {}" > export.js
      - git add export.js
      - git commit -q -m "Add export to PDF"
      - echo "1.0" > VERSION
      - git add VERSION
      - git commit -q -m "Set version to 1.0"
      - git remote add origin "$PRACTICE_GITHUB_URL"
      - git push -q --force --mirror origin
      - git fetch -q origin
      - git branch -q --set-upstream-to=origin/main main
    goal:
      - check: tag-is-annotated
        tag: v1.0
        label: "v1.0 is an annotated tag in your repository"
      - check: tag-is-on-commit
        tag: v1.0
        message: "Set version to 1.0"
        label: "v1.0 sits on the commit \"Set version to 1.0\""
      - check: github-release-exists
        tag: v1.0
        label: "GitHub shows a published release for v1.0"
    hints:
      - "Three steps, in this order: make the tag, send the tag, publish the release. Read \"Publish a release on GitHub\" in Must know."
      - "git tag -a makes the tag and git push origin v1.0 sends it. Then gh release create builds the release on the tag; give it --title and --notes, or it stops to ask questions."
      - "Run: git tag -a v1.0 -m \"Version 1.0\", then git push origin v1.0, then gh release create v1.0 --title \"Version 1.0\" --notes \"First public release with search and export to PDF.\""
    solution:
      - git tag -a v1.0 -m "Version 1.0"
      - git push -q origin v1.0
      - gh release create v1.0 --title "Version 1.0" --notes "First public release with search and export to PDF."

  - id: release-an-older-version
    title: The release that was never published
    level: hard
    brief: "This challenge runs on a practice repository in your own GitHub account. Version 1.1 shipped at the commit \"Set version to 1.1\", and main has moved on since. Nobody tagged 1.1 and GitHub has no release for it. Tag that commit as v1.1 (annotated), push the tag, and publish a release for it. Let GitHub write the notes."
    github:
      repo: gitremastered-practice-tags-and-releases
    setup:
      - git init -q -b main
      - git config core.autocrlf false
      - git config user.name > /dev/null || git config user.name "Practice Student"
      - git config user.email > /dev/null || git config user.email "student@example.com"
      - echo "# Notes app" > README.md
      - git add README.md
      - git commit -q -m "Add README"
      - echo "function search() {}" > search.js
      - git add search.js
      - git commit -q -m "Add search page"
      - echo "1.0" > VERSION
      - git add VERSION
      - git commit -q -m "Set version to 1.0"
      - git tag -a v1.0 -m "Version 1.0"
      - echo "function exportPdf() {}" > export.js
      - git add export.js
      - git commit -q -m "Add export to PDF"
      - echo "1.1" > VERSION
      - git commit -q -am "Set version to 1.1"
      - 'echo "body { background: black; }" > dark.css'
      - git add dark.css
      - git commit -q -m "Start the dark theme"
      - git remote add origin "$PRACTICE_GITHUB_URL"
      - git push -q --force --mirror origin
      - git fetch -q origin
      - git branch -q --set-upstream-to=origin/main main
    goal:
      - check: tag-is-on-commit
        tag: v1.1
        message: "Set version to 1.1"
        label: "v1.1 sits on the commit \"Set version to 1.1\""
      - check: tag-is-annotated
        tag: v1.1
        label: "v1.1 is an annotated tag in your repository"
      - check: github-release-exists
        tag: v1.1
        label: "GitHub shows a published release for v1.1"
      - check: branch-is-at-commit
        branch: main
        message: "Start the dark theme"
        label: "main is still on \"Start the dark theme\""
    hints:
      - "The release belongs on an older commit, not on the newest one. Find its ID with git log --oneline. If you let gh make the tag for you, where would the tag go? Read \"Let gh check the tag\" in Advanced."
      - "Tag the older commit yourself (a commit ID at the end of git tag -a), push the tag, then create the release. The option --generate-notes makes GitHub write the notes, and --verify-tag stops gh if the tag is not on GitHub."
      - "Run: git tag -a v1.1 <id> -m \"Version 1.1\" with the ID of \"Set version to 1.1\", then git push origin v1.1, then gh release create v1.1 --generate-notes --verify-tag"
    solution:
      - git tag -a v1.1 -m "Version 1.1" "$(git log --format=%h --grep='Set version to 1.1')"
      - git push -q origin v1.1
      - gh release create v1.1 --generate-notes --verify-tag

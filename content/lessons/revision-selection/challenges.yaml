# All five challenges read the same project: a recipe book with 16 commits by two people
# (Lina Park and Sam Ortiz), two merged branches (soups, desserts), one fast-forwarded branch
# (cleanup), two open branches (drinks, salads) and the tag v1.0.
# "&recipe-history" names the setup list once; "*recipe-history" reuses it, so all five stay equal.
# Every commit sets its author, committer and dates, so the IDs are the same on every computer.
# It is also the practice project the lesson's Try-its read; no Try-it asks a challenge's question.
challenges:
  - id: two-before-main
    title: The commit two before main
    level: easy
    brief: "A teammate asks which commit main was on two commits ago. Without copying an ID out of git log, find the commit two steps before the newest commit on main, and write its short ID into answer.txt, for example with: echo a1b2c3d > answer.txt"
    setup: &recipe-history
      - git init -q -b main
      - git config core.autocrlf false
      - git config user.name > /dev/null || git config user.name "Practice Student"
      - git config user.email > /dev/null || git config user.email "student@example.com"
      - echo answer.txt >> .git/info/exclude
      - echo "# Recipe book" > README.md
      - git add .
      - GIT_AUTHOR_NAME="Lina Park" GIT_AUTHOR_EMAIL=lina@recipes.example GIT_COMMITTER_NAME="Lina Park" GIT_COMMITTER_EMAIL=lina@recipes.example GIT_AUTHOR_DATE="2026-10-05T09:00:00+0000" GIT_COMMITTER_DATE="2026-10-05T09:00:00+0000" git commit -q -m "Add README"
      - echo "Pancakes. Fry each side for 5 minutes." > pancakes.txt
      - git add .
      - GIT_AUTHOR_NAME="Lina Park" GIT_AUTHOR_EMAIL=lina@recipes.example GIT_COMMITTER_NAME="Lina Park" GIT_COMMITTER_EMAIL=lina@recipes.example GIT_AUTHOR_DATE="2026-10-06T10:30:00+0000" GIT_COMMITTER_DATE="2026-10-06T10:30:00+0000" git commit -q -m "Add pancake recipe"
      - git switch -q -c soups
      - echo "Tomato soup. Simmer for 20 minutes." > tomato-soup.txt
      - git add .
      - GIT_AUTHOR_NAME="Sam Ortiz" GIT_AUTHOR_EMAIL=sam@recipes.example GIT_COMMITTER_NAME="Sam Ortiz" GIT_COMMITTER_EMAIL=sam@recipes.example GIT_AUTHOR_DATE="2026-10-08T15:00:00+0000" GIT_COMMITTER_DATE="2026-10-08T15:00:00+0000" git commit -q -m "Add tomato soup recipe"
      - git switch -q main
      - echo "Omelette. Three eggs, low heat." > omelette.txt
      - git add .
      - GIT_AUTHOR_NAME="Lina Park" GIT_AUTHOR_EMAIL=lina@recipes.example GIT_COMMITTER_NAME="Lina Park" GIT_COMMITTER_EMAIL=lina@recipes.example GIT_AUTHOR_DATE="2026-10-09T11:15:00+0000" GIT_COMMITTER_DATE="2026-10-09T11:15:00+0000" git commit -q -m "Add omelette recipe"
      - GIT_AUTHOR_NAME="Lina Park" GIT_AUTHOR_EMAIL=lina@recipes.example GIT_COMMITTER_NAME="Lina Park" GIT_COMMITTER_EMAIL=lina@recipes.example GIT_AUTHOR_DATE="2026-10-12T09:40:00+0000" GIT_COMMITTER_DATE="2026-10-12T09:40:00+0000" git merge -q --no-edit soups
      - git branch -q -d soups
      - git tag v1.0
      - git switch -q -c desserts
      - echo "Brownies. Bake for 25 minuts." > brownies.txt
      - git add .
      - GIT_AUTHOR_NAME="Sam Ortiz" GIT_AUTHOR_EMAIL=sam@recipes.example GIT_COMMITTER_NAME="Sam Ortiz" GIT_COMMITTER_EMAIL=sam@recipes.example GIT_AUTHOR_DATE="2026-10-14T14:20:00+0000" GIT_COMMITTER_DATE="2026-10-14T14:20:00+0000" git commit -q -m "Add brownie recipe"
      - echo "Cookies. Bake for 12 minutes." > cookies.txt
      - git add .
      - GIT_AUTHOR_NAME="Sam Ortiz" GIT_AUTHOR_EMAIL=sam@recipes.example GIT_COMMITTER_NAME="Sam Ortiz" GIT_COMMITTER_EMAIL=sam@recipes.example GIT_AUTHOR_DATE="2026-10-15T16:05:00+0000" GIT_COMMITTER_DATE="2026-10-15T16:05:00+0000" git commit -q -m "Add cookie recipe"
      - git switch -q -c salads v1.0
      - echo "Greek salad. Tomato, cucumber, feta." > greek-salad.txt
      - git add .
      - GIT_AUTHOR_NAME="Sam Ortiz" GIT_AUTHOR_EMAIL=sam@recipes.example GIT_COMMITTER_NAME="Sam Ortiz" GIT_COMMITTER_EMAIL=sam@recipes.example GIT_AUTHOR_DATE="2026-10-16T12:00:00+0000" GIT_COMMITTER_DATE="2026-10-16T12:00:00+0000" git commit -q -m "Add greek salad recipe"
      - git switch -q main
      - echo "Pancakes. Fry each side for 2 minutes." > pancakes.txt
      - git add .
      - GIT_AUTHOR_NAME="Lina Park" GIT_AUTHOR_EMAIL=lina@recipes.example GIT_COMMITTER_NAME="Lina Park" GIT_COMMITTER_EMAIL=lina@recipes.example GIT_AUTHOR_DATE="2026-10-19T08:50:00+0000" GIT_COMMITTER_DATE="2026-10-19T08:50:00+0000" git commit -q -m "Fix pancake cooking time"
      - GIT_AUTHOR_NAME="Lina Park" GIT_AUTHOR_EMAIL=lina@recipes.example GIT_COMMITTER_NAME="Lina Park" GIT_COMMITTER_EMAIL=lina@recipes.example GIT_AUTHOR_DATE="2026-10-21T10:10:00+0000" GIT_COMMITTER_DATE="2026-10-21T10:10:00+0000" git merge -q --no-edit desserts
      - git branch -q -d desserts
      - git switch -q -c cleanup
      - echo "In this book you find brownies, cookies, omelette, pancakes and tomato soup." >> README.md
      - git add .
      - GIT_AUTHOR_NAME="Lina Park" GIT_AUTHOR_EMAIL=lina@recipes.example GIT_COMMITTER_NAME="Lina Park" GIT_COMMITTER_EMAIL=lina@recipes.example GIT_AUTHOR_DATE="2026-10-26T13:30:00+0000" GIT_COMMITTER_DATE="2026-10-26T13:30:00+0000" git commit -q -m "Sort the recipe list"
      - echo "Brownies. Bake for 25 minutes." > brownies.txt
      - git add .
      - GIT_AUTHOR_NAME="Lina Park" GIT_AUTHOR_EMAIL=lina@recipes.example GIT_COMMITTER_NAME="Lina Park" GIT_COMMITTER_EMAIL=lina@recipes.example GIT_AUTHOR_DATE="2026-10-27T09:25:00+0000" GIT_COMMITTER_DATE="2026-10-27T09:25:00+0000" git commit -q -m "Fix typo in brownie recipe"
      - git switch -q main
      - git merge -q cleanup
      - git branch -q -d cleanup
      - git switch -q -c drinks
      - echo "Lemonade. Four lemons, one litre of water." > lemonade.txt
      - git add .
      - GIT_AUTHOR_NAME="Sam Ortiz" GIT_AUTHOR_EMAIL=sam@recipes.example GIT_COMMITTER_NAME="Sam Ortiz" GIT_COMMITTER_EMAIL=sam@recipes.example GIT_AUTHOR_DATE="2026-11-02T11:00:00+0000" GIT_COMMITTER_DATE="2026-11-02T11:00:00+0000" git commit -q -m "Add lemonade recipe"
      - echo "Iced tea. Brew, cool, add ice." > iced-tea.txt
      - git add .
      - GIT_AUTHOR_NAME="Sam Ortiz" GIT_AUTHOR_EMAIL=sam@recipes.example GIT_COMMITTER_NAME="Sam Ortiz" GIT_COMMITTER_EMAIL=sam@recipes.example GIT_AUTHOR_DATE="2026-11-03T15:45:00+0000" GIT_COMMITTER_DATE="2026-11-03T15:45:00+0000" git commit -q -m "Add iced tea recipe"
      - echo "Smoothie. Banana, berries, yoghurt." > smoothie.txt
      - git add .
      - GIT_AUTHOR_NAME="Sam Ortiz" GIT_AUTHOR_EMAIL=sam@recipes.example GIT_COMMITTER_NAME="Sam Ortiz" GIT_COMMITTER_EMAIL=sam@recipes.example GIT_AUTHOR_DATE="2026-11-05T10:35:00+0000" GIT_COMMITTER_DATE="2026-11-05T10:35:00+0000" git commit -q -m "Add smoothie recipe"
      - git switch -q main
      - echo "Eggs, flour, lemons, tomatoes." > shopping-list.txt
      - git add .
      - GIT_AUTHOR_NAME="Lina Park" GIT_AUTHOR_EMAIL=lina@recipes.example GIT_COMMITTER_NAME="Lina Park" GIT_COMMITTER_EMAIL=lina@recipes.example GIT_AUTHOR_DATE="2026-11-09T14:00:00+0000" GIT_COMMITTER_DATE="2026-11-09T14:00:00+0000" git commit -q -m "Add shopping list"
    goal:
      - check: answer-is-commit
        message: "Sort the recipe list"
        label: "answer.txt holds the ID of the commit two before main"
    hints:
      - "Which sign after a name means \"go back this many commits\"?"
      - "main~2 is two steps back from main. git rev-parse turns a name into an ID, and --short keeps it short."
      - "Run: git rev-parse --short main~2 > answer.txt (the > writes the output into the file)."
    solution:
      - git rev-parse --short main~2 > answer.txt

  - id: tip-of-merged-branch
    title: Where did the deleted branch end?
    level: medium
    brief: "Version 1.0 (the tag v1.0) is a merge commit. The branch that was merged in, soups, has been deleted since. Find the commit that was the newest one on soups when it was merged, and write its short ID into answer.txt."
    setup: *recipe-history
    goal:
      - check: answer-is-commit
        message: "Add tomato soup recipe"
        label: "answer.txt holds the ID of the last commit of the merged branch"
    hints:
      - "A merge commit has two parents. Which of them comes from the branch that was merged in?"
      - "git show -s v1.0 prints both parents on its Merge line. The caret with a number picks one of them."
      - "Run: git rev-parse --short v1.0^2 > answer.txt"
    solution:
      - git rev-parse --short v1.0^2 > answer.txt

  - id: commits-since-release
    title: How much changed since version 1.0?
    level: medium
    brief: "The release notes need a number: how many commits has main gained since the tag v1.0? Count every commit that is in main today and was not part of v1.0, and write the number into answer.txt, for example with: echo 4 > answer.txt"
    setup: *recipe-history
    goal:
      - check: answer-is
        answer: "7"
        label: "answer.txt holds the number of commits in main that v1.0 lacks"
    hints:
      - "You want the commits main has and v1.0 lacks. Which range says that, and in which order do the two names go?"
      - "git log --oneline v1.0..main lists them. Commits that came in through a merge count too, and so does the merge commit itself."
      - "Run: git rev-list --count v1.0..main > answer.txt"
    solution:
      - git rev-list --count v1.0..main > answer.txt

  - id: how-far-apart
    title: How far apart are salads and drinks?
    level: hard
    brief: "Sam wants to merge salads and drinks one day and asks how far the two branches have drifted apart. Count the commits that are on exactly one of the two branches (on salads or on drinks, but not on both), and write the number into answer.txt."
    setup: *recipe-history
    goal:
      - check: answer-is
        answer: "10"
        label: "answer.txt holds the number of commits that only one of the two branches has"
    hints:
      - "Two dots give you one side only. Under the hood shows a range that gives both sides at once."
      - "git log --oneline --left-right salads...drinks lists every commit that only one branch has, with < or > for its side. drinks holds far more than its own three commits that salads lacks."
      - "Run: git rev-list --count salads...drinks > answer.txt"
    solution:
      - git rev-list --count salads...drinks > answer.txt

  - id: before-the-cleanup
    title: Where was main before the cleanup merge?
    level: hard
    brief: "Some days ago Lina merged a branch called cleanup into main and deleted the branch. The merge was a fast-forward, so the history shows no trace of it. Find the commit main pointed at just before that merge, and write its short ID into answer.txt."
    setup: *recipe-history
    goal:
      - check: answer-is-commit
        message: "Merge branch 'desserts'"
        label: "answer.txt holds the ID of the commit main was on before cleanup was merged"
    hints:
      - "git log cannot tell you: a fast-forward makes no commit. Which diary records every move of a branch?"
      - "git reflog show main lists the moves of main, newest first. Find the line that says merge cleanup. That line is where main went; the line below it is where main was before."
      - "The line below is main@{2}. Run: git rev-parse --short \"main@{2}\" > answer.txt"
    solution:
      - git rev-parse --short "main@{2}" > answer.txt

# ci.yml: runs every test and code check on GitHub for each push and pull request.
# Same commands as on your PC (docs/SPEC.md section 6), so "green here" means "green there".
# Everything runs from the repository root: the desktop app is in apps/desktop, shared code in packages/.

name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Tests and code checks
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # Linux libraries Tauri needs to compile (from the Tauri prerequisites guide).
      - name: Install Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Uses the pnpm version named in the root package.json ("packageManager").
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust with rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keeps compiled Rust libraries between runs, so later runs take minutes, not ten.
      - name: Reuse compiled Rust libraries
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install JavaScript libraries
        run: pnpm install --frozen-lockfile

      # Component tests run in a real headless Chromium.
      - name: Install the test browser
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint and format check (all projects)
        run: pnpm lint

      - name: Type check (all projects)
        run: pnpm check

      - name: Tests (screens and course engine)
        run: pnpm test

      # The Rust core embeds the built screens, so build them first.
      - name: Build the screens
        run: pnpm build

      - name: Format check (Rust)
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Lint (Rust)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Tests (Rust)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Every lesson's mission, run with real Git: setup + reference solution must reach every goal.
      - name: Mission tests
        run: pnpm test:missions
